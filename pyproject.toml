[project]
name = "callscope"
version = "0.1.0"
description = "Fully local two-speaker call analysis and QA scoring pipeline."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Kathleen Bartin", email = "kathleen@prodigalparadigm.com" }]
keywords = ["speech", "diarization", "call-center", "qa", "whisper", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Transcription backends. Install exactly one; callscope picks the best available
# at runtime. See README "Transcription backends".
mlx = ["mlx-whisper>=0.4"]           # Apple Silicon, preferred
faster = ["faster-whisper>=1.0"]     # CTranslate2, CPU/CUDA
openai = ["openai-whisper>=20231117"]  # reference PyTorch implementation

# Optional diarization backend. Requires a HuggingFace token and manual
# acceptance of the pyannote model licences; callscope does not need it.
# 3.x and 4.x are both accepted: 4.0 renamed `use_auth_token` to `token`, and
# diarize.py resolves the keyword from the signature rather than assuming one.
pyannote = ["pyannote.audio>=3.1"]

# Optional LLM judge for the semantic track.
# 1.0 is the floor the code is written against: `output_config` structured
# output and the current error hierarchy both landed there.
llm = ["anthropic>=1.0,<2"]

# Floors are the oldest releases this repository was actually checked against.
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.13",
  "mypy>=1.12",
  "types-PyYAML>=6.0",
  "scipy-stubs>=1.18",
]

[project.scripts]
callscope = "callscope.cli:main"

[project.urls]
Homepage = "https://github.com/comelyhunger/callscope"
Source = "https://github.com/comelyhunger/callscope"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callscope"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit rather than inherited, so `ruff check` is a gate that means something:
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, comprehensions, and the
# blind-except rule. The two blind excepts that remain carry `noqa` with the
# reason -- both are deliberate failure isolation, not swallowed errors.
select = ["E", "F", "W", "I", "B", "UP", "C4", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "requires_ffmpeg: test shells out to ffmpeg and is skipped when it is absent",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/callscope"]
# The test suite deliberately builds malformed rubrics, judges and transcripts to
# prove the pipeline refuses them, so it is linted but not type-checked.

[[tool.mypy.overrides]]
# Optional backends behind extras. They ship no stubs, and the dev environment
# installs none of them, so their absence must not be a type error -- the code
# that touches them is guarded by an availability probe at runtime.
module = ["pyannote.*", "mlx_whisper.*", "faster_whisper.*", "whisper.*"]
ignore_missing_imports = true
