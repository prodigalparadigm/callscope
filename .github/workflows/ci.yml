name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Twelve tests shell out to ffmpeg. They skip without it; install it so
      # the full suite actually runs.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # setup-uv with python-version already created and activated .venv;
      # install into it. (--system targets the runner's externally managed
      # interpreter and fails; a second `uv venv` collides with this one.)
      - name: Install
        run: uv pip install -e ".[dev]"

      # No speech model is installed: the default path has to work without one.
      - name: Test
        run: .venv/bin/python -m pytest -rs

      - name: Lint
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .

      - name: Types
        run: .venv/bin/mypy
