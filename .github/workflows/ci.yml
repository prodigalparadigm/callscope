name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Twelve tests shell out to ffmpeg. They skip without it; install it so
      # the full suite actually runs.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      # No speech model is installed: the default path has to work without one.
      - name: Test
        run: uv run python -m pytest -rs

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Types
        run: uv run mypy
